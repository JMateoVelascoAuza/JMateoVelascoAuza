<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="220" height="96" viewBox="0 0 220 96" role="img" aria-label="Work with me — email">
<title>Work with me — email</title>
<style>@font-face{font-family:Sora;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:Sora,'Segoe UI',Helvetica,Arial,sans-serif;fill:#F3F4FF;white-space:pre}
.g{fill:#8A8DAA}.a{fill:#8E90FF}.s{fill:#D5D7EE}.w4{font-weight:400}.w6{font-weight:600}.w7{font-weight:700}
.up{opacity:0;animation:up .7s cubic-bezier(.2,.8,.2,1) forwards}@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.fade{opacity:0;animation:fade .8s ease forwards}@keyframes fade{to{opacity:1}}
.bob{animation:bob 4s ease-in-out infinite alternate}@keyframes bob{from{transform:translateY(-5px)}to{transform:translateY(6px)}}
.bounce{animation:bounce 1.4s cubic-bezier(.4,0,.6,1) infinite}@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}
.arr{animation:arr 1.6s ease-in-out infinite}@keyframes arr{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}</style>
<defs>
<linearGradient id="sq" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4D79FF"><animate attributeName="stop-color" values="#4D79FF;#7FA1FF;#4D79FF" dur="6s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#1A2260"/></linearGradient>
<clipPath id="r"><rect width="220" height="96" rx="16"/></clipPath>
</defs>
<rect x=".5" y=".5" width="219" height="95" rx="16" fill="#0B0C1C" stroke="#0B0C1C"/>
<rect x="4" y="4" width="212" height="88" rx="4" fill="#2F2CE0"/>
<text x="30" y="42" font-size="24" class="w7" style="fill:#FFFFFF">Work</text><text x="30" y="76" font-size="24" class="w7" style="fill:#FFFFFF">with me</text>
<g class="arr"><path d="M18 53 H190 M180 44 l10 9 l-10 9" stroke="#FFFFFF" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
